<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Версии моделей: один вопрос — четыре клетки</title>

<!--
  Страница опыта: жмём кнопку, смотрим, как заполняется таблица «клетки × прогоны»,
  и переключателем выбираем, что в клетках показано — ответ, время, токены или деньги.
  Один файл, обычный JavaScript, никаких сборок и никаких внешних загрузок: страница
  обязана открываться и работать без сети — единственные обращения идут к своему же
  серверу (`/settings`, `/run`, `/summary`).

  Крупный шрифт и отсутствие движущихся украшений — не вкусовщина: страницу снимают
  на видео, и в кадре важна читаемость, а не оживление.
-->

<style>
  /* Темы отдаются системе: свои цвета фона и текста не назначаем вовсе, берём
     системные, поэтому светлая и тёмная получаются сами собой. */
  :root { color-scheme: light dark; }

  body {
    margin: 0;
    padding: 24px 28px 48px;
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  h1 { font-size: 26px; margin: 0 0 18px; }
  h2 { font-size: 21px; margin: 34px 0 12px; }

  /* --- переключатели вида --- */
  .виды { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
  .виды label {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; font-size: 18px; cursor: pointer;
    border: 1px solid rgba(128, 128, 128, .45); border-radius: 8px;
  }
  .виды label:has(input:checked) {
    border-color: rgba(128, 128, 128, .9);
    background: rgba(128, 128, 128, .18);
    font-weight: 600;
  }
  .виды input { width: 16px; height: 16px; margin: 0; }

  /* --- запуск --- */
  .строка-запуска { display: flex; align-items: center; gap: 14px; margin: 0 0 16px; }
  button {
    font: inherit; font-size: 18px; font-weight: 600;
    padding: 10px 22px; border-radius: 8px;
    border: 1px solid rgba(128, 128, 128, .6);
    cursor: pointer;
  }
  button:disabled { cursor: default; opacity: .75; }
  .сообщение {
    margin: 0 0 16px; padding: 10px 14px; font-size: 16px;
    border-left: 4px solid #c25450; background: rgba(194, 84, 80, .18); border-radius: 4px;
  }

  /* --- текст вопроса --- */
  .текст-вопроса {
    margin: 0 0 22px; padding: 14px 16px;
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    border: 1px solid rgba(128, 128, 128, .35); border-radius: 8px;
    background: rgba(128, 128, 128, .08);
  }

  /* --- таблицы --- */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  col.подпись { width: 120px; }
  th, td {
    border: 1px solid rgba(128, 128, 128, .35);
    padding: 10px 12px; vertical-align: top; text-align: left;
  }
  thead th { text-align: center; background: rgba(128, 128, 128, .12); }
  td.подпись, th.подпись { font-size: 17px; font-weight: 600; text-align: left; }

  /* Шапка столбца в две строки: роль читается издали, клетка уточняет, из чего роль
     сложена (модель и режим рассуждений). */
  .роль { font-size: 20px; font-weight: 700; }
  .клетка, .пояснение { font-size: 14px; font-weight: 400; opacity: .75; margin-top: 2px; }

  .значение { font-size: 24px; font-weight: 700; margin-bottom: 8px; word-break: break-word; }
  .ответ {
    white-space: pre-wrap; max-height: 240px; overflow: auto;
    font-size: 14px; line-height: 1.45;
    padding-left: 10px; border-left: 2px solid rgba(128, 128, 128, .35);
  }
  .мера { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
  .мера + .мера { margin-top: 4px; }
  .мера-имя { opacity: .7; }
  .мера-число { font-weight: 700; font-size: 17px; white-space: nowrap; }
  .мера.отдельно { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(128, 128, 128, .35); }
  .нет-замера { font-weight: 600; opacity: .55; }
  .служебное { margin-top: 8px; font-size: 13px; opacity: .6; }
  .ошибка {
    margin-bottom: 8px; padding: 8px 10px; font-size: 15px; font-weight: 600;
    border-radius: 4px; background: rgba(194, 84, 80, .28);
  }
  td.сбой { background: rgba(194, 84, 80, .12); }
  td.ожидание {
    text-align: center; font-size: 20px; font-weight: 600; opacity: .7;
    background: rgba(128, 128, 128, .16);
  }
  td.пусто { text-align: center; font-size: 20px; opacity: .35; }

  /* --- окно вывода --- */
  /* Столбцов в сводке двенадцать, и на узком экране они бы либо слиплись, либо утащили
     за собой всю страницу. Прокрутка отдана самой таблице: заголовок опыта, кнопка и
     таблица прогонов остаются на месте. */
  .прокрутка { overflow-x: auto; }
  table.сводка { table-layout: auto; margin-bottom: 8px; }
  table.сводка th { font-size: 15px; }
  table.сводка td { font-size: 16px; vertical-align: middle; }
  table.сводка td.клетка-имя { font-weight: 600; }
  table.сводка td.число { text-align: right; white-space: nowrap; }
  .примечание { margin: 0 0 8px; font-size: 15px; opacity: .65; }
  .вывод {
    margin: 0; padding: 14px 16px; font-size: 17px; line-height: 1.5;
    white-space: pre-wrap;
    border: 1px solid rgba(128, 128, 128, .35); border-radius: 8px;
    background: rgba(128, 128, 128, .08);
  }
  .вывод.пусто { font-style: italic; opacity: .6; }
</style>

<h1>Версии моделей: один вопрос — четыре клетки</h1>

<form class="виды" id="виды"></form>

<div class="строка-запуска">
  <button type="button" id="запустить" disabled>сделать запрос</button>
</div>

<div class="сообщение" id="сообщение" hidden></div>

<pre class="текст-вопроса" id="текст-вопроса"></pre>

<table>
  <colgroup id="колонки">
    <col class="подпись">
  </colgroup>
  <thead id="шапка"></thead>
  <tbody id="тело"></tbody>
</table>

<h2>посчитано из журнала</h2>
<p class="примечание" id="примечание-сводки" hidden></p>
<div class="прокрутка">
  <table class="сводка">
    <thead id="шапка-сводки"></thead>
    <tbody id="тело-сводки"></tbody>
  </table>
</div>

<h2>разбор ответов</h2>
<div class="вывод" id="вывод"></div>

<script>
"use strict";

// Столбцы таблицы, число прогонов и текст вопроса приходят от сервера (`/settings`) —
// оттуда же, откуда их берёт сам прогон. Своего списка страница не держит: разъехавшись
// с сервером, он оставил бы на экране старые столбцы, и каждая клетка молча падала бы в
// прочерк — отказ без единого сообщения.
let КЛЕТКИ = [];

// Сколько прогонов добавляет одно нажатие. Нужно ровно для одного: показать клетки
// ожидания сразу после нажатия, пока не пришёл ни один ответ. Настоящие номера
// прогонов приходят в событиях от сервера — эта величина их не назначает.
let ПОВТОРОВ = 0;

const НЕТ_ЗАМЕРА = "нет замера";
const ПРОЧЕРК = "—";

// Виды показа клетки. Список свой, а не серверный: это способ смотреть на одни и те же
// данные, а не часть состава опыта — сервер о нём ничего не знает и знать не должен.
const ВИДЫ = [
  { id: "ответ", title: "ответ" },
  { id: "время", title: "время" },
  { id: "токены", title: "токены" },
  { id: "деньги", title: "деньги" }
];

let вид = "ответ";

// --- хранилище собранного ----------------------------------------------------
//
// Всё собранное держится здесь списком событий клеток. Таблица каждый раз рисуется
// заново из этого списка, а не правится на месте: смена вида тогда не требует ни нового
// запроса, ни разбора того, что уже нарисовано, — достаточно нарисовать всё ещё раз.
// Данные для всех четырёх видов приходят в одном и том же событии, за один прогон,
// поэтому переключение вида к серверу не ходит.
const собрано = [];

// Идущий прогон: `{номера, источник}`. `номера` — номера прогонов, которые уже
// встретились в событиях; по ним видно, сколько строк ожидания ещё показывать.
let прогон = null;

const узелВидов = document.getElementById("виды");
const узелТекста = document.getElementById("текст-вопроса");
const узелКолонок = document.getElementById("колонки");
const узелШапки = document.getElementById("шапка");
const узелТела = document.getElementById("тело");
const узелСообщения = document.getElementById("сообщение");
const кнопка = document.getElementById("запустить");
const узелШапкиСводки = document.getElementById("шапка-сводки");
const узелТелаСводки = document.getElementById("тело-сводки");
const узелПримечания = document.getElementById("примечание-сводки");
const узелВывода = document.getElementById("вывод");

// --- мелкие помощники --------------------------------------------------------

/** Узел с классом и текстом. Текст кладётся через `textContent`: ответ модели —
 *  чужой текст, и разметки в нём быть не должно. */
function эл(тег, класс, текст) {
  const узел = document.createElement(тег);
  if (класс) узел.className = класс;
  if (текст !== undefined && текст !== null) узел.textContent = текст;
  return узел;
}

function показатьСообщение(текст) {
  if (текст) {
    узелСообщения.textContent = текст;
    узелСообщения.hidden = false;
  } else {
    узелСообщения.textContent = "";
    узелСообщения.hidden = true;
  }
}

function этоЧисло(значение) {
  return typeof значение === "number" && isFinite(значение);
}

/** Время из миллисекунд. Секунды с одним знаком от секунды и выше, иначе миллисекунды:
 *  «0.3 с» скрывает разницу между 260 и 340 мс, а именно на ней и видно, какая клетка
 *  начинает отвечать раньше. Отсутствие замера — словами, а не нулём: ноль читается как
 *  «мгновенно» и переворачивает вывод опыта. */
function времяИзМиллисекунд(значение) {
  if (!этоЧисло(значение)) return null;
  if (значение >= 1000) return (значение / 1000).toFixed(1) + " с";
  return Math.round(значение) + " мс";
}

function скорость(значение) {
  if (!этоЧисло(значение)) return null;
  return значение.toFixed(1);
}

/** Деньги за вызов. Показываем в долларах с шестью знаками после точки: цена одного
 *  вызова — тысячные и десятитысячные доллара, и при двух-трёх знаках вся таблица стала
 *  бы столбцом нулей. Научная запись читается на видео хуже всего, поэтому её нет вовсе.
 *  Совсем крошечная, но ненулевая цена всё же округлилась бы в ноль — такой случай
 *  показываем девятью знаками: ноль вместо ненулевой цены — это ложь, а не округление. */
function деньги(значение) {
  if (!этоЧисло(значение)) return ПРОЧЕРК;
  let текст = значение.toFixed(6);
  if (значение !== 0 && Number(текст) === 0) текст = значение.toFixed(9);
  return текст + " $";
}

/** Счётчик токенов либо `null`, если значение негодно.
 *
 *  Отрицательное число негодно наравне с нечисловым — ровно так же считает сервер
 *  (`_счётчик` в `models/summary.py`). Расхождение здесь было бы хуже самой порчи:
 *  клетка показывала бы одно число, а сводка внизу той же страницы — другое, и оба
 *  выглядели бы одинаково правдоподобно. */
function счётчик(значение) {
  if (!этоЧисло(значение) || значение < 0) return null;
  return Math.round(значение);
}

function целое(значение) {
  const счёт = счётчик(значение);
  return счёт === null ? "0" : String(счёт);
}

/** Токены рассуждений в любой из двух форм, которыми их присылает провайдер: то
 *  вложенным `completion_tokens_details.reasoning_tokens`, то плоским `reasoning_tokens`
 *  на верхнем уровне.
 *
 *  Вложенная форма выигрывает только годным значением, а не самим наличием ключа.
 *  Пустое вложенное поле рядом с заполненным плоским — ровно тот случай, когда проверка
 *  на ключ затёрла бы известное число нулём: клетка сказала бы «рассуждений нет», а
 *  сводка внизу той же страницы — настоящий расход. Правило взято у сервера
 *  (`_токены_рассуждений` в `models/summary.py`) дословно. */
function токеныРассуждений(usage) {
  if (!usage) return null;
  const подробности = usage.completion_tokens_details;
  if (подробности) {
    const вложенное = счётчик(подробности.reasoning_tokens);
    if (вложенное !== null) return вложенное;
  }
  return usage.reasoning_tokens;
}

/** Строка «подпись — число» внутри клетки. Пустой замер показывается словами и
 *  приглушённо, чтобы его нельзя было принять за измеренную величину. */
function мера(имя, текст, отдельно) {
  const строка = эл("div", отдельно ? "мера отдельно" : "мера");
  строка.append(эл("span", "мера-имя", имя));
  строка.append(эл("span", текст === null ? "мера-число нет-замера" : "мера-число",
    текст === null ? НЕТ_ЗАМЕРА : текст));
  return строка;
}

// --- отрисовка таблицы прогонов ----------------------------------------------

function нарисоватьПереключатели() {
  узелВидов.textContent = "";
  ВИДЫ.forEach(function (описание) {
    const подпись = document.createElement("label");
    const кружок = document.createElement("input");
    кружок.type = "radio";
    кружок.name = "вид";
    кружок.value = описание.id;
    кружок.checked = описание.id === вид;
    кружок.addEventListener("change", function () {
      вид = описание.id;
      // К серверу не ходим: всё нужное уже лежит в `собрано` — событие клетки несёт
      // сразу ответ, замеры времени, расход токенов и цену.
      перерисовать();
    });
    подпись.append(кружок, document.createTextNode(описание.title));
    узелВидов.append(подпись);
  });
}

function нарисоватьШапку() {
  узелКолонок.textContent = "";
  узелКолонок.append(эл("col", "подпись"));
  узелШапки.textContent = "";
  const строка = document.createElement("tr");
  строка.append(эл("th", "подпись", ""));
  КЛЕТКИ.forEach(function (клетка) {
    узелКолонок.append(document.createElement("col"));
    const заголовок = эл("th");
    заголовок.append(эл("div", "роль", клетка.role));
    заголовок.append(эл("div", "клетка", клетка.title));
    строка.append(заголовок);
  });
  узелШапки.append(строка);
}

/** Номера строк таблицы: всё, что собрано, плюс номера идущего прогона. Число строк
 *  определяется собранным, а не постоянной величиной — поэтому повторное нажатие
 *  дописывает прогоны, а не заменяет их. */
function номераСтрок() {
  const набор = new Set();
  собрано.forEach(function (клетка) { набор.add(клетка.repetition); });
  if (прогон) {
    прогон.номера.forEach(function (номер) { набор.add(номер); });
  }
  return Array.from(набор).sort(function (а, б) { return а - б; });
}

/** Собранное, разложенное по ключу «номер прогона + клетка». */
function разложитьПоКлеткам() {
  const карта = new Map();
  собрано.forEach(function (клетка) {
    карта.set(клетка.repetition + "|" + клетка.cell_id, клетка);
  });
  return карта;
}

/** Служебная строка клетки: причина остановки и число попыток.
 *
 *  Попытки показываются только когда их больше одной. За оборванную попытку провайдер
 *  берёт деньги, а в записанной стоимости учтена лишь удачная — значит клетка с двумя
 *  попытками обошлась дороже показанного, и человек обязан это видеть. Постоянная
 *  надпись «попыток: 1» на всех клетках была бы шумом и научила бы её не замечать. */
function служебнаяСтрока(данные) {
  const части = [];
  if (данные.finish_reason) части.push("остановка: " + данные.finish_reason);
  if (этоЧисло(данные.attempts) && данные.attempts > 1) {
    части.push("попыток: " + данные.attempts);
  }
  return части.join(" · ");
}

function содержимоеОтвета(ячейка, данные) {
  // Ответ показывается и при сбое: часть текста могла успеть прийти.
  if (данные.answer) {
    ячейка.append(эл("div", "ответ", данные.answer));
  } else if (данные.status !== "error") {
    ячейка.append(эл("div", "значение", ПРОЧЕРК));
  }
}

function содержимоеВремени(ячейка, данные) {
  ячейка.append(мера("до первого токена", времяИзМиллисекунд(данные.ttft_ms)));
  ячейка.append(мера("до первого слова ответа", времяИзМиллисекунд(данные.ttfa_ms)));
  ячейка.append(мера("полное", времяИзМиллисекунд(данные.total_ms)));
  ячейка.append(мера("токенов в секунду", скорость(данные.tokens_per_sec), true));
}

function содержимоеТокенов(ячейка, данные) {
  const usage = данные.usage || {};
  ячейка.append(мера("вход", целое(usage.prompt_tokens)));
  ячейка.append(мера("из промежуточного хранилища", целое(usage.prompt_cache_hit_tokens)));
  ячейка.append(мера("мимо хранилища", целое(usage.prompt_cache_miss_tokens)));
  ячейка.append(мера("выход", целое(usage.completion_tokens), true));
  // Рассуждения — отдельной строкой: они входят в выход, но именно ими различаются
  // клетки опыта, и слитые с выходом они бы эту разницу спрятали.
  ячейка.append(мера("из них рассуждения", целое(токеныРассуждений(usage))));
}

function содержимоеДенег(ячейка, данные) {
  ячейка.append(эл("div", "значение", деньги(данные.cost)));
}

/** Готовая клетка. Вид меняет только содержимое; окраска сбоя и текст ошибки
 *  показываются в любом виде — сбой нельзя прятать за переключателем. */
function клеткаСОтветом(данные) {
  const ячейка = эл("td", данные.status === "error" ? "сбой" : null);
  if (данные.status === "error" && данные.error) {
    ячейка.append(эл("div", "ошибка", данные.error));
  }
  if (вид === "время") содержимоеВремени(ячейка, данные);
  else if (вид === "токены") содержимоеТокенов(ячейка, данные);
  else if (вид === "деньги") содержимоеДенег(ячейка, данные);
  else содержимоеОтвета(ячейка, данные);
  // Служебная строка идёт в любом виде, а не только под ответом: в виде «деньги» именно
  // она объясняет, почему стоящая рядом цена занижена, а в виде «токены» причина
  // остановки объясняет обрезанный расход.
  const служебное = служебнаяСтрока(данные);
  if (служебное) ячейка.append(эл("div", "служебное", служебное));
  return ячейка;
}

function строкаТаблицы(подписьСтроки, клетки) {
  const строка = document.createElement("tr");
  строка.append(эл("td", "подпись", подписьСтроки));
  клетки.forEach(function (ячейка) { строка.append(ячейка); });
  return строка;
}

function перерисовать() {
  кнопка.disabled = КЛЕТКИ.length === 0 || прогон !== null;
  кнопка.textContent = прогон !== null ? "идёт запрос…" : "сделать запрос";

  узелТела.textContent = "";
  if (!КЛЕТКИ.length) return;

  const карта = разложитьПоКлеткам();
  const идёт = прогон !== null;

  номераСтрок().forEach(function (номер) {
    const клетки = КЛЕТКИ.map(function (клетка) {
      const данные = карта.get(номер + "|" + клетка.id);
      if (данные) return клеткаСОтветом(данные);
      // Клетки идущего прогона ждут ответа; клетка прежнего прогона, которой нет,
      // осталась пустой — прогон был прерван.
      if (идёт && прогон.номера.indexOf(номер) !== -1) return эл("td", "ожидание", "ждём ответа…");
      return эл("td", "пусто", ПРОЧЕРК);
    });
    узелТела.append(строкаТаблицы("прогон " + номер, клетки));
  });

  // Пока не пришёл первый ответ, номера прогонов неизвестны — сервер назначает их сам,
  // продолжая нумерацию в журнале. Поэтому строки без номера показываются как ожидание
  // и получают настоящие подписи, как только приходят первые клетки.
  if (идёт) {
    const безНомера = Math.max(0, ПОВТОРОВ - прогон.номера.length);
    for (let i = 0; i < безНомера; i += 1) {
      const клетки = КЛЕТКИ.map(function () { return эл("td", "ожидание", "ждём ответа…"); });
      узелТела.append(строкаТаблицы("прогон …", клетки));
    }
  }
}

// --- прогон ------------------------------------------------------------------

function принятьКлетку(данные) {
  собрано.push(данные);
  if (прогон.номера.indexOf(данные.repetition) === -1) {
    прогон.номера.push(данные.repetition);
    прогон.номера.sort(function (а, б) { return а - б; });
  }
  // Рисуем каждую клетку сразу, а не копим до конца прогона: смысл потока событий
  // именно в том, чтобы таблица заполнялась по одной клетке на глазах.
  перерисовать();
}

function завершить(сообщение) {
  if (прогон && прогон.источник) {
    // Поток закрывается со своей стороны: иначе браузер, увидев конец ответа,
    // начнёт переподключаться и запустит прогон заново — а он платный.
    прогон.источник.close();
  }
  прогон = null;
  if (сообщение) показатьСообщение(сообщение);
  перерисовать();
  // Журнал дописан — забираем свежую сводку сразу, не дожидаясь очередного опроса,
  // и возвращаем опрос в работу.
  обновитьСводку();
  запуститьОпрос();
}

function запустить() {
  if (прогон !== null || !КЛЕТКИ.length) return;

  показатьСообщение(null);
  прогон = { номера: [], источник: null };
  остановитьОпрос();
  перерисовать();

  // Параметров нет: вопрос в опыте один, прогоняются все клетки сразу.
  const источник = new EventSource("/run");
  прогон.источник = источник;

  источник.onmessage = function (событие) {
    if (прогон === null) return;
    let данные;
    try {
      данные = JSON.parse(событие.data);
    } catch (сбой) {
      завершить("не удалось разобрать событие от сервера");
      return;
    }
    if (данные.kind === "cell") {
      принятьКлетку(данные);
    } else if (данные.kind === "done") {
      завершить(null);
    } else if (данные.kind === "error") {
      // Сбой всего прогона (нет ключа, клиент не завёлся) — не про отдельную клетку,
      // поэтому идёт сообщением человеку, а не в таблицу.
      завершить(данные.message || "прогон не удался");
    }
  };

  источник.onerror = function () {
    if (прогон === null) return;
    завершить("связь с сервером прервалась");
  };
}

кнопка.addEventListener("click", запустить);

// --- окно вывода: сводка по журналу и разбор ответов -------------------------

// Три величины времени идут подряд и подписаны теми же словами, что и в клетке
// отдельного прогона: человек читает подпись один раз и дальше узнаёт её везде. Разница
// между ними — предмет всего опыта: у клетки с рассуждениями первый токен приходит через
// секунду, а первое слово ответа — только через семь, и одним «временем ответа» это не
// описывается. Пояснение «медиана (мин–макс)» вынесено во вторую строку заголовка, а не
// приписано к каждому названию: три одинаковых хвоста подряд читаются как шум и
// затрудняют именно то, ради чего столбцы поставлены рядом, — их сравнение.
const СТОЛБЦЫ_СВОДКИ = [
  { имя: "клетка" },
  { имя: "прогонов" },
  { имя: "сбоев" },
  { имя: "до первого токена", пояснение: "медиана (мин–макс)" },
  { имя: "до первого слова ответа", пояснение: "медиана (мин–макс)" },
  { имя: "полное время", пояснение: "медиана (мин–макс)" },
  { имя: "токенов в секунду", пояснение: "медиана" },
  { имя: "токены: вход / выход" },
  { имя: "из них рассуждения" },
  { имя: "деньги" },
  { имя: "дороже базовой" },
  { имя: "медленнее базовой" }
];

function нарисоватьШапкуСводки() {
  узелШапкиСводки.textContent = "";
  const строка = document.createElement("tr");
  СТОЛБЦЫ_СВОДКИ.forEach(function (столбец) {
    const заголовок = эл("th");
    заголовок.append(эл("div", null, столбец.имя));
    if (столбец.пояснение) заголовок.append(эл("div", "пояснение", столбец.пояснение));
    строка.append(заголовок);
  });
  узелШапкиСводки.append(строка);
}

/** Медиана с краями. Края стоят рядом с медианой и читаются как её края — поэтому либо
 *  показываем всё, либо прочерк: медиана без разброса выглядит точнее, чем она есть. */
function разбросВремени(поле) {
  if (!поле || !этоЧисло(поле.median)) return ПРОЧЕРК;
  return времяИзМиллисекунд(поле.median) +
    " (" + времяИзМиллисекунд(поле.min) + "–" + времяИзМиллисекунд(поле.max) + ")";
}

function отношение(значение) {
  if (!этоЧисло(значение)) return ПРОЧЕРК;
  return значение.toFixed(2) + "×";
}

function числоИлиПрочерк(значение, преобразователь) {
  const текст = преобразователь(значение);
  return текст === null ? ПРОЧЕРК : текст;
}

function строкаСводки(столбец, базовая) {
  const строка = document.createElement("tr");
  const токены = столбец.tokens || {};
  const имя = столбец.role + " · " + столбец.title + (столбец.cell_id === базовая ? " (базовая)" : "");
  строка.append(эл("td", "клетка-имя", имя));
  [
    String(столбец.n),
    String(столбец.errors),
    разбросВремени(столбец.ttft_ms),
    разбросВремени(столбец.ttfa_ms),
    разбросВремени(столбец.total_ms),
    числоИлиПрочерк(столбец.tokens_per_sec && столбец.tokens_per_sec.median, скорость),
    целое(токены.cache_hit + токены.cache_miss) + " / " + целое(токены.output),
    целое(токены.reasoning),
    деньги(столбец.cost),
    отношение(столбец.cost_ratio),
    отношение(столбец.time_ratio)
  ].forEach(function (текст) { строка.append(эл("td", "число", текст)); });
  return строка;
}

function показатьСводку(ответ) {
  const сводка = ответ.summary || {};
  const столбцы = сводка.cells || [];

  узелТелаСводки.textContent = "";
  столбцы.forEach(function (столбец) {
    узелТелаСводки.append(строкаСводки(столбец, сводка.base));
  });

  // Столбцы приходят все четыре всегда, даже по пустому журналу, поэтому «прогонов нет»
  // определяется не длиной списка, а суммой прогонов и сбоев.
  const всего = столбцы.reduce(function (сумма, столбец) {
    return сумма + столбец.n + столбец.errors;
  }, 0);
  if (всего === 0) {
    узелПримечания.textContent = "журнал пуст: ни одного прогона ещё не записано";
    узелПримечания.hidden = false;
  } else {
    узелПримечания.hidden = true;
  }

  // Разбор пишет человек в файл после прогона, поэтому его отсутствие — обычное
  // состояние страницы. Две пустоты разные, и разница обязана быть видна: «не считали»
  // (журнал пуст) и «посчитали, а вывод ещё не написан» — это разные новости.
  const разбор = ответ.verdict;
  if (typeof разбор === "string" && разбор.trim() !== "") {
    // Это Markdown, но полноценного разбора разметки страница не делает: текст показан
    // как есть с сохранением переносов строк — для чтения в кадре этого достаточно.
    узелВывода.className = "вывод";
    узелВывода.textContent = разбор;
  } else {
    узелВывода.className = "вывод пусто";
    узелВывода.textContent = всего === 0
      ? "прогон ещё не делался"
      : "прогон сделан, вывод ещё не написан";
  }
}

function обновитьСводку() {
  fetch("/summary")
    .then(function (ответ) {
      if (!ответ.ok) throw new Error("сервер ответил " + ответ.status);
      return ответ.json();
    })
    .then(показатьСводку)
    .catch(function (сбой) {
      // Сбой опроса пишем в примечание сводки, а не в общее сообщение: общее занято
      // сбоями прогона, и затирать их раз в три секунды нельзя.
      узелПримечания.textContent = "сводка не обновилась: " + сбой.message;
      узелПримечания.hidden = false;
    });
}

// Окно обновляется само, раз в три секунды. Это не украшение, а требование съёмки:
// запись экрана заканчивается через десять секунд после того, как вывод появился в окне,
// значит появиться он обязан сам, на камеру. Обновление руками в кадре выглядело бы
// подделкой, а перезагрузка страницы стёрла бы таблицу. Опрос идёт только к своему
// серверу, читает файл на диске и денег не стоит.
let опрос = null;

function запуститьОпрос() {
  if (опрос === null) опрос = setInterval(обновитьСводку, 3000);
}

// Пока идёт прогон, опрос останавливается: события и так идут потоком, а журнал в этот
// момент дописывается — сводка по недописанному журналу дёргалась бы в кадре.
function остановитьОпрос() {
  if (опрос !== null) {
    clearInterval(опрос);
    опрос = null;
  }
}

// --- загрузка состава опыта --------------------------------------------------

function получить(адрес) {
  return fetch(адрес).then(function (ответ) {
    if (!ответ.ok) throw new Error(адрес + ": сервер ответил " + ответ.status);
    return ответ.json();
  });
}

нарисоватьШапкуСводки();

получить("/settings")
  .then(function (настройки) {
    КЛЕТКИ = настройки.cells || [];
    ПОВТОРОВ = настройки.repeats || 0;
    // Текст вопроса берётся у сервера, а не вшит в разметку: показанный на странице
    // вопрос обязан быть тем самым, который уходит в API.
    узелТекста.textContent = настройки.question || "";
    нарисоватьПереключатели();
    нарисоватьШапку();
    перерисовать();
  })
  .catch(function (сбой) {
    показатьСообщение("не удалось получить состав опыта от сервера: " + сбой.message);
  });

обновитьСводку();
запуститьОпрос();
</script>
</html>
