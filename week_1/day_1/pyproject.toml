[project]
name = "myharness"
version = "0.1.0"
description = "Минимальный терминальный harness для DeepSeek API"
readme = "README.md"
authors = [
    { name = "AlexandrKorytin", email = "koritin84@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "prompt-toolkit>=3.0.47",
]

[project.scripts]
myharness = "myharness:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
