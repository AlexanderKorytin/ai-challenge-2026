[project]
name = "myharnesslogic"
version = "0.1.0"
description = "Терминальный harness для DeepSeek API — сборка ветки дня 3"
readme = "README.md"
authors = [
    { name = "AlexandrKorytin", email = "koritin84@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "prompt-toolkit>=3.0.47",
]

[project.scripts]
myharnesslogic = "myharness:main"

# Имя дистрибутива в этой ветке отличается от main намеренно: так команда myharnesslogic
# (код ветки дня 3) и команда myharness (код main) живут рядом, не вытесняя друг друга.
# Сам импортируемый пакет остаётся myharness.
[tool.uv.build-backend]
module-name = "myharness"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
