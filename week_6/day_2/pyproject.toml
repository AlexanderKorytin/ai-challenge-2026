[project]
name = "calories"
version = "0.1.0"
description = "Утилита командной строки: калорийность и гликемический индекс блюда от местной модели"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
"калории" = "calories.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calories"]
