[project]
name = "myharness"
version = "0.1.0"
description = "Минимальный терминальный harness для DeepSeek API"
readme = "README.md"
authors = [
    { name = "AlexandrKorytin", email = "koritin84@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    # Клиент DeepSeek строит свой транспорт из `httpx2` (повтор установки соединения): библиотека
    # OpenAI работает поверх него начиная с третьей версии, и транспорт обязан быть той же библиотеки.
    "httpx2>=2.12",
    "openai>=3.6",
    "prompt-toolkit>=3.0.47",
    "tokenizers>=0.20",
]

[project.scripts]
myharness = "myharness:main"

[tool.uv.build-backend]
# Сборщик кладёт в дистрибутив только модули Python. Словарь токенизатора — данные, и без
# этой строки установленная команда осталась бы без него и считала бы токены на глазок.
source-include = ["src/myharness/data/*.json"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
