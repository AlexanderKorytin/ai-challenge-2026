[project]
name = "support-web"
version = "0.1.0"
description = "Учебный веб-чат поддержки myharness: вход по имени, ассистент с MCP и RAG"
requires-python = ">=3.11"
dependencies = [
    # Агент, мост MCP и клиенты моделей — из библиотеки myharness как есть.
    "myharness",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.uv.sources]
myharness = { path = "../../../myharness" }

