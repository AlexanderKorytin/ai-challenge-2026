<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игровой агент</title>
<style>
:root {
  --фон: #f6f5f2; --лист: #ffffff; --текст: #1d1d1f; --тихий: #6b6b70; --рамка: #e2e0da;
  --акцент: #2f6fde; --плюс: #1f8a4c; --минус: #c23b3b; --скидка: #d9480f; --тень: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --фон: #16171a; --лист: #1f2125; --текст: #ececee; --тихий: #9a9ba2; --рамка: #33353b;
    --акцент: #6c9cff; --плюс: #45c27a; --минус: #ff6b6b; --скидка: #ff8a4c; --тень: none; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--фон); color: var(--текст);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 16px;
  border-bottom: 1px solid var(--рамка); background: var(--лист); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 18px; margin: 0 auto 0 0; }
button { font: inherit; border: 1px solid var(--рамка); background: var(--лист); color: var(--текст);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--акцент); }
button:disabled { opacity: .5; cursor: default; }
button.плюс { color: var(--плюс); } button.минус { color: var(--минус); }
nav { display: flex; gap: 4px; padding: 10px 16px 0; flex-wrap: wrap; }
nav button { border-radius: 8px 8px 0 0; border-bottom: none; }
nav button.выбрана { background: var(--акцент); color: #fff; border-color: var(--акцент); }
main { padding: 16px; max-width: 980px; margin: 0 auto; }
.сетка { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.игра { background: var(--лист); border: 1px solid var(--рамка); border-radius: 12px; padding: 12px;
  box-shadow: var(--тень); display: flex; flex-direction: column; gap: 6px; }
.игра a { color: var(--акцент); font-weight: 600; text-decoration: none; font-size: 16px; }
.тихо { color: var(--тихий); font-size: 13px; }
.скидка { color: var(--скидка); font-weight: 600; }
.кнопки { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.кнопки input { flex: 1; min-width: 0; font: inherit; padding: 5px 8px; border-radius: 8px;
  border: 1px solid var(--рамка); background: var(--фон); color: var(--текст); }
.пусто { color: var(--тихий); padding: 24px 0; }
.игра { cursor: pointer; } .игра:hover { border-color: var(--акцент); }
.оценка { font-weight: 700; }
.выбор { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-bottom: 12px; }
.выбор label { background: var(--лист); border: 2px solid var(--рамка); border-radius: 10px; overflow: hidden; cursor: pointer; display: block; }
.выбор label.отмечена { border-color: var(--плюс); }
.выбор img { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; display: block; background: var(--фон); }
.выбор .подпись { padding: 6px 8px; font-size: 13px; display: flex; gap: 6px; align-items: flex-start; }
.закреп { position: sticky; bottom: 0; background: var(--фон); padding: 12px 0; border-top: 1px solid var(--рамка); z-index: 2; }
.ход-агента { align-self: flex-start; display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px;
  background: var(--лист); border: 1px solid var(--рамка); color: var(--тихий); }
.крутилка { width: 16px; height: 16px; border: 2px solid var(--рамка); border-top-color: var(--акцент); border-radius: 50%;
  animation: вращение 0.8s linear infinite; flex: none; }
@keyframes вращение { to { transform: rotate(360deg); } }
.заглушка { display: flex; align-items: center; justify-content: center; color: var(--тихий); font-weight: 600;
  text-align: center; padding: 8px; background: linear-gradient(135deg, var(--рамка), var(--фон)); }
.обложка { width: calc(100% + 24px); margin: -12px -12px 4px; aspect-ratio: 460 / 215; object-fit: cover;
  border-radius: 12px 12px 0 0; background: var(--фон); display: block; }
.плашка { background: var(--лист); border: 1px solid var(--скидка); border-radius: 12px; padding: 12px; margin-bottom: 12px;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.шаг { background: var(--лист); border: 1px solid var(--рамка); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.шаг h3 { margin: 0 0 6px; font-size: 15px; } .шаг ol { margin: 6px 0; padding-left: 20px; }
.шаг input { width: 100%; font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--рамка);
  background: var(--фон); color: var(--текст); margin: 6px 0; }
.готово { color: var(--плюс); font-weight: 600; } .нет { color: var(--минус); font-weight: 600; }
code { background: var(--фон); padding: 1px 5px; border-radius: 5px; }
#разговор { display: flex; flex-direction: column; gap: 10px; }
.реплика { max-width: 85%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
.реплика.агент { white-space: normal; }
.человек { align-self: flex-end; background: var(--акцент); color: #fff; }
.агент { align-self: flex-start; background: var(--лист); border: 1px solid var(--рамка); }
.инструмент { align-self: flex-start; color: var(--тихий); font-size: 12px; }
form.ввод { display: flex; gap: 8px; margin-top: 12px; }
#место > div > textarea { width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px; min-height: 54px;
  border: 1px solid var(--рамка); background: var(--лист); color: var(--текст); }
form.ввод textarea { flex: 1; font: inherit; padding: 8px 10px; border-radius: 10px; min-height: 44px;
  border: 1px solid var(--рамка); background: var(--лист); color: var(--текст); resize: vertical; }
.месяц { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.день { background: var(--лист); border: 1px solid var(--рамка); border-radius: 8px; min-height: 72px;
  padding: 4px; font-size: 12px; overflow: hidden; }
.день.чужой { opacity: .35; } .день.сегодня { border-color: var(--акцент); }
.день a { display: block; color: var(--акцент); text-decoration: none; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.шапка-месяца { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.шапка-месяца b { min-width: 150px; text-align: center; }
ul.лента { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
ul.лента li { background: var(--лист); border: 1px solid var(--рамка); border-radius: 8px; padding: 8px 10px; }
.род-скидка { border-left: 4px solid var(--скидка) !important; }
.род-сбой { border-left: 4px solid var(--минус) !important; }
h2 { font-size: 16px; margin: 18px 0 8px; }
#весть { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 560px; margin: 0 auto;
  background: var(--текст); color: var(--фон); padding: 10px 14px; border-radius: 10px; display: none;
  white-space: pre-wrap; z-index: 3; }
@media (max-width: 560px) { .день { min-height: 48px; font-size: 10px; } .реплика { max-width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Игровой агент</h1>
  <button id="день" title="Поиск вышедших игр и проверка скидок">Задание дня</button>
  <button id="неделя" title="Будущие выпуски в календарь">Задание недели</button>
  <button id="пересобрать">Пересобрать вкус</button>
</header>
<div id="ход-заданий" style="padding:0 16px"></div>
<nav id="вкладки"></nav>
<main id="место"></main>
<div id="весть"></div>
<script>
const ВКЛАДКИ = [["предложения", "Предложения"], ["желаемое", "Желаемое"], ["календарь", "Календарь"],
  ["библиотека", "Библиотека"], ["вкус", "Вкус и запреты"], ["лента", "Лента"], ["настройки", "Настройки"]];
const МЕСЯЦЫ = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
let с = null, вкладка = "предложения", месяц = new Date(), идёт_ответ = false, черновик = [];
try { вкладка = localStorage.getItem("вкладка") || вкладка; } catch (e) {}
// Адрес вида `#календарь` открывает вкладку сразу — для ссылок и снимков страницы.
if (location.hash) вкладка = decodeURIComponent(location.hash.slice(1));

const $ = (т, свойства = {}, ...дети) => {
  const у = document.createElement(т);
  for (const [к, з] of Object.entries(свойства)) {
    if (к.startsWith("on")) у.addEventListener(к.slice(2), з); else if (к === "класс") у.className = з; else у[к] = з;
  }
  for (const д of дети.flat(Infinity)) if (д != null) у.append(д);
  return у;
};
function весть(текст) {
  const в = document.getElementById("весть"); в.textContent = текст; в.style.display = "block";
  clearTimeout(весть.т); весть.т = setTimeout(() => в.style.display = "none", 6000);
}
async function послать(путь, тело) {
  const о = await fetch(путь, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(тело || {}) });
  const д = await о.json().catch(() => ({}));
  if (!о.ok) throw new Error(д.error || ("HTTP " + о.status));
  return д;
}
let проверка_начата = null;
let таймер = null, к_настройкам = false, начато = false, отмеченные = null, ход_агента = { шаг: "", шагов: 0 };
// Строка хода — человеческими словами вместо имён инструментов (живой сценарий пользователя).
function шаг_словами(имя, доводы) {
  let д = {}; try { д = JSON.parse(доводы || "{}"); } catch (e) {}
  const к = имя.replace(/^mcp__steam__/, "");
  return ({
    list_library: "Смотрю вашу библиотеку",
    steam_find: `Ищу «${д.name || "игру"}» в магазине`,
    steam_tags: "Подбираю метки магазина под ваш вкус",
    steam_search: "Ищу игры по метке",
    steam_game: "Смотрю сведения об игре",
    save_taste: "Записываю ваш вкус",
  })[к] || "Работаю";
}
async function обновить() {
  // Одна цепочка опроса: кнопки зовут `обновить()` сами, и прежний таймер снимается.
  clearTimeout(таймер);
  const сырое = await (await fetch("/api/state")).text();
  const новое = JSON.parse(сырое);
  // Состояние не изменилось — страницу не перерисовываем: иначе картинки грузятся заново и
  // карточки прыгают каждые 5 секунд (живой сценарий пользователя).
  if (сырое === обновить.прежнее && !идёт_ответ) { if (с.задания_идут.length || (!с.опрос_пройден && !с.мастер_пройден)) таймер = setTimeout(обновить, 5000); return; }
  обновить.прежнее = сырое;
  const пишет = [...document.querySelectorAll("#место input, #место textarea")].some(п => п.value || п === document.activeElement);
  с = новое;
  // Человек вводит ключ или реплику — состояние обновлено, страница не перерисовывается и
  // введённое не стирается (повторный просмотр).
  if ((пишет || качаю) && !с.опрос_пройден && !с.мастер_пройден && !идёт_ответ) { таймер = setTimeout(обновить, 5000); return; }
  if (!идёт_ответ) черновик = с.разговор.flatMap(п => [["человек", п.вопрос], ["агент", п.ответ]]);
  рисовать();
  // Задание идёт или мастер ждёт местную модель — страница сама опрашивает состояние.
  if (с.задания_идут.length || (!с.опрос_пройден && !с.мастер_пройден)) таймер = setTimeout(обновить, 5000);
}
function рубли(к, в) { if (к == null) return ""; return в && в !== "RUB" ? (к / 100).toFixed(2) + " " + в : Math.round(к / 100).toLocaleString("ru-RU") + " ₽"; }
function цена(и) {
  if (и.бесплатна) return "бесплатно";
  const ц = и.последняя_цена ?? и.цена, ск = и.последняя_скидка ?? и.скидка;
  if (ц == null) return и.вышла === false ? "ещё не продаётся" : "";
  return ск ? $("span", { класс: "скидка" }, `−${ск} % · ${рубли(ц, и.валюта)}`) : рубли(ц, и.валюта);
}
// Обложка: адрес из магазина (у новых игр путь с хешем), иначе — по номеру. Нет картинки —
// заглушка того же размера: карточка не меняет высоту и не прыгает (живой сценарий).
function обложка(и) {
  const адрес = и.обложка || `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${Number(и.номер)}/header.jpg`;
  const картинка = $("img", { класс: "обложка", loading: "lazy", alt: "", src: адрес });
  картинка.onerror = () => картинка.replaceWith($("div", { класс: "обложка заглушка" }, и.имя || ""));
  return картинка;
}
// Дата выхода — полностью и с днями до выхода: «5 ноя.» из магазина читали как июнь (живой
// сценарий). Щелчок открывает в календаре нужный месяц.
function дата_выхода(и) {
  if (!и.дата) return $("div", { класс: "тихо" }, `Выход: ${и.дата_текст || "не объявлен"}`);
  const д = new Date(и.дата + "T00:00:00");
  const дней = Math.round((д - new Date(new Date().toDateString())) / 86400000);
  const через = дней > 0 ? ` — через ${дней} ${склонить(дней, "день", "дня", "дней")}` : дней === 0 ? " — сегодня" : "";
  return $("div", { класс: "тихо" }, "Выход: ",
    $("a", { href: "#", textContent: д.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }).replace(" г.", ""),
      onclick: е => { е.preventDefault(); е.stopPropagation(); месяц = new Date(д.getFullYear(), д.getMonth(), 1); месяц_выбран = true; вкладка = "календарь"; рисовать(); window.scrollTo(0, 0); } }),
    через);
}
function склонить(н, один, два, пять) {
  const к = Math.abs(н) % 100, е = к % 10;
  return к > 10 && к < 20 ? пять : е === 1 ? один : е >= 2 && е <= 4 ? два : пять;
}
function карточка(и, оценивать = true) {
  const причина = $("input", { placeholder: "Почему нет?", title: "Причина — по желанию: агент учтёт её во вкусе", onclick: е => е.stopPropagation(), onkeydown: е => е.stopPropagation() });
  const стоп = f => е => { е.stopPropagation(); f(); };
  const сыграл = $("span", { style: "display:none;gap:6px" },
    $("button", { textContent: "понравилась", onclick: стоп(() => играл(и, true, причина.value)) }),
    $("button", { textContent: "не понравилась", onclick: стоп(() => играл(и, false, причина.value)) }));
  // Причина отказа — рядом с «Нет», во всю ширину, подсказка видна целиком (живой сценарий).
  const кнопки = оценивать ? $("div", { style: "display:flex;flex-direction:column;gap:6px;margin-top:auto" },
    $("div", { класс: "кнопки" },
      $("button", { класс: "плюс", textContent: "👍 Хочу", onclick: стоп(() => оценить(и, true, "")) }),
      $("button", { textContent: "Уже играл", onclick: стоп(() => { сыграл.style.display = "inline-flex"; }) }),
      сыграл),
    $("div", { класс: "кнопки" }, причина,
      $("button", { класс: "минус", textContent: "👎 Нет", onclick: стоп(() => оценить(и, false, причина.value)) }))) : null;
  // Нажатие на плашку открывает игру в клиенте Steam (решение пользователя).
  return $("div", { класс: "игра", title: "Открыть в клиенте Steam", onclick: () => { location.href = "steam://store/" + и.номер; } },
    обложка(и),
    $("div", {}, $("b", { style: "font-size:16px" }, и.имя || ("игра " + и.номер)), " ",
      $("a", { href: и.ссылка, target: "_blank", rel: "noopener", класс: "тихо", textContent: "в браузере", onclick: е => е.stopPropagation() })),
    $("div", { класс: "тихо" }, (и.жанры || []).join(", ")),
    $("div", {}, и.оценка_steamdb != null ? $("span", { класс: "оценка" }, `оценка ${и.оценка_steamdb} % · `) : null,
      "пользователи Steam: ", $("b", {}, и.отзывы || "отзывов нет")),
    и.вышла === false ? дата_выхода(и) : null,
    $("div", {}, цена(и), и.источник === "steam" ? $("span", { класс: "тихо" }, " · из списка желаемого Steam") : null),
    и.причина ? $("div", { класс: "тихо" }, "Почему: " + и.причина) : null,
    кнопки);
}
async function играл(и, понравилась, причина) {
  try {
    весть(`Отмечаю «${и.имя}» и пересматриваю вкус…`);
    const д = await послать("/api/played", { номер: и.номер, понравилась, причина });
    весть(д.итог + (д.пересмотр ? "\n\n" + д.пересмотр : ""));
  } catch (e) { весть("Не вышло: " + e.message); }
  обновить();
}
async function оценить(и, плюс, причина) {
  try {
    if (!плюс) весть(`Запрещаю «${и.имя}» и пересматриваю вкус…`);
    const д = await послать("/api/rate", { номер: и.номер, плюс, причина });
    весть(д.итог + (д.пересмотр ? "\n\n" + д.пересмотр : "") + (д.вкус_записан === false ? "\n\nВкус не изменён." : ""));
  } catch (e) { весть("Не вышло: " + e.message); }
  обновить();
}
function сетка(список, оценивать, пусто) {
  return список.length ? $("div", { класс: "сетка" }, список.map(и => карточка(и, оценивать))) : $("div", { класс: "пусто" }, пусто);
}
let месяц_выбран = false;
function календарь() {
  if (!месяц_выбран) {
    // Первый показ — месяц ближайшего выпуска, а не просто текущий: иначе отметок не видно.
    const сегодня = new Date().toISOString().slice(0, 10);
    const ближайший = с.календарь.map(и => и.дата).filter(д => д && д >= сегодня).sort()[0];
    if (ближайший) { const д = new Date(ближайший + "T00:00:00"); месяц = new Date(д.getFullYear(), д.getMonth(), 1); }
    месяц_выбран = true;
  }
  const г = месяц.getFullYear(), м = месяц.getMonth();
  const по_дням = {};
  for (const и of с.календарь) if (и.дата) (по_дням[и.дата] ||= []).push(и);
  const первый = new Date(г, м, 1), сдвиг = (первый.getDay() + 6) % 7;
  const сегодня = new Date().toISOString().slice(0, 10);
  const дни = [];
  for (let i = 0; i < 42; i++) {
    const д = new Date(г, м, 1 - сдвиг + i), ключ = `${д.getFullYear()}-${String(д.getMonth() + 1).padStart(2, "0")}-${String(д.getDate()).padStart(2, "0")}`;
    дни.push($("div", { класс: "день" + (д.getMonth() !== м ? " чужой" : "") + (ключ === сегодня ? " сегодня" : "") },
      $("div", { класс: "тихо" }, String(д.getDate())),
      (по_дням[ключ] || []).map(и => $("a", { href: и.ссылка, target: "_blank", title: и.имя + (и.причина ? " — " + и.причина : ""), textContent: и.имя }))));
  }
  const без_даты = с.календарь.filter(и => !и.дата);
  return $("div", {},
    $("div", { класс: "шапка-месяца" },
      $("button", { textContent: "‹", onclick: () => { месяц = new Date(г, м - 1, 1); рисовать(); } }),
      $("b", {}, `${МЕСЯЦЫ[м]} ${г}`),

      хвост += декодер.decode(value, { stream: true });
      const строки = хвост.split("\n"); хвост = строки.pop();
      for (const с_ of строки) {
        if (!с_) continue; const е = JSON.parse(с_);
        if (е.kind === "content") черновик[черновик.length - 1][1] += е.text;
        else if (е.kind === "tool") { ход_агента = { шаг: шаг_словами(е.name, е.args), шагов: ход_агента.шагов + 1 }; }
        else if (е.kind === "done" && е.error) черновик[черновик.length - 1][1] += "\n[ошибка: " + е.error + "]";
        рисовать();
      }
    }
  } catch (e) { черновик[черновик.length - 1][1] = "[ошибка: " + e.message + "]"; }
  идёт_ответ = false; await обновить();
}
function строка_хода(род, х) {
  const имя = род === "day" ? "Задание дня" : "Задание недели";
  const счёт = х.нужно ? (х.этап === "сужу игры" ? `: подошло ${х.подошло || 0} из ${х.нужно}, проверено ${х.проверено || 0}` : `, нужно ${х.нужно}`) : "";
  const мин = х.время ? Math.max(0, Math.round((Date.now() - new Date(х.время)) / 60000)) : null;
  return $("div", { класс: "ход-агента", style: "margin:8px 0" }, $("div", { класс: "крутилка" }),
    `${имя} · ${х.этап || "начинаю"}${счёт}` + (мин ? ` · последний шаг ${мин} мин назад` : ""));
}
function рисовать() {
  const место = document.getElementById("место"), вкладки = document.getElementById("вкладки");
  for (const р of ["день", "неделя"]) {
    const к = document.getElementById(р), идёт = с.задания_идут.includes(р === "день" ? "day" : "week");
    к.disabled = идёт || !с.опрос_пройден; к.textContent = (р === "день" ? "Задание дня" : "Задание недели") + (идёт ? " — идёт…" : "");
  }
  вкладки.replaceChildren(); место.replaceChildren();
  document.getElementById("ход-заданий").replaceChildren(
    ...Object.entries(с.ход_заданий || {}).map(([род, х]) => строка_хода(род, х)));
  // Мастер держится, пока человек сам не нажмёт «Перейти к знакомству»: необязательные ключи
  // он должен успеть ввести (живой сценарий пользователя).
  if ((!настройка_готова() || !с.мастер_пройден) && !с.опрос_пройден) {
    место.append($("h2", {}, "Настройка"), настройки(true));
    return;
  }
  if (!с.опрос_пройден && к_настройкам) {
    место.append($("div", { класс: "кнопки" }, $("button", { textContent: "← К знакомству", onclick: () => { к_настройкам = false; рисовать(); } })),
      $("h2", {}, "Настройки"), настройки(false));
    return;
  }
  if (!с.опрос_пройден) {
    // До конца опроса вкладок нет — вернуться к ключам и модели можно этой кнопкой (вопрос пользователя).
    место.append($("div", { класс: "кнопки" }, $("button", { textContent: "← Настройки", onclick: () => { к_настройкам = true; рисовать(); } })));
    if (!черновик.length && с.библиотека.length) { место.append(выбор_любимых()); return; }
    место.append($("h2", {}, "Знакомство"), разговор("Смотрю вашу библиотеку Steam — сейчас задам первый вопрос."));
    // Библиотеки нет — агент начинает сам: пустое поле с просьбой «напишите начнём» сбивало.
    if (!черновик.length && !идёт_ответ && !начато) { начато = true; setTimeout(() => сказать("Привет, начнём"), 0); }
    return;
  }
  if (!с.вкус_подтверждён) { место.append(проверка_вкуса()); return; }
  if (с.сверка_нужна) место.append($("div", { класс: "плашка" }, "Прошло полгода — пора сверить вкус.",
    $("button", { textContent: "Сверить", onclick: async () => { const д = await послать("/api/review/start"); вкладка = "разговор"; рисовать(); сказать(д.приветствие); } }),
    $("button", { textContent: "Сверка готова", onclick: async () => { весть((await послать("/api/review/done")).итог); обновить(); } })));
  for (const [ключ, имя] of ВКЛАДКИ) {
    const число = ключ === "предложения" ? с.предложения.length : ключ === "желаемое" ? с.желаемое.length : null;
    вкладки.append($("button", { класс: ключ === вкладка ? "выбрана" : "", textContent: имя + (число ? ` (${число})` : ""),
      onclick: () => { вкладка = ключ; try { localStorage.setItem("вкладка", ключ); } catch (e) {} рисовать(); } }));
  }
  const вид = {
    предложения: () => сетка(с.предложения, true, с.задания_идут.includes("day") ? "Задание дня идёт: подбираю 10 игр, это займёт несколько минут." : "Новых предложений нет. Задание дня ищет их каждый день в 11:00 — или нажмите «Задание дня» вверху."),
    желаемое: () => сетка(с.желаемое, false, "Список пуст: поставьте 👍 предложенной игре."),
    календарь, библиотека, вкус, лента, настройки: () => настройки(false),
  }[вкладка] || (() => сетка(с.предложения, true, ""));
  место.append(вид());
}
document.getElementById("день").onclick = async () => { try { await послать("/api/run/day"); весть("Задание дня запущено"); } catch (e) { весть(e.message); } обновить(); };
document.getElementById("неделя").onclick = async () => { try { await послать("/api/run/week"); весть("Задание недели запущено"); } catch (e) { весть(e.message); } обновить(); };
document.getElementById("пересобрать").onclick = async () => {
  if (!confirm("Начать опрос вкуса заново? Запреты останутся.")) return;
  try { const д = await послать("/api/retaste"); черновик = []; вкладка = "разговор"; await обновить(); сказать(д.приветствие); }
  catch (e) { весть(e.message); }
};
обновить().catch(e => весть("Нет связи с агентом: " + e.message));
</script>
