[project]
name = "pipeline-mcp"
version = "0.1.0"
description = "MCP-сервер цепочки: поиск в Википедии, выжимка DeepSeek, сохранение в файл"
requires-python = ">=3.11"
dependencies = [
    # Та же граница, что у клиента myharness и сервера cbr: следующая крупная версия ломает молча.
    "mcp>=2.2,<3",
    # Клиент HTTP, которым ходит сама библиотека mcp; объявлен явно, потому что сервер
    # импортирует его сам.
    "httpx2>=2.12,<3",
]
