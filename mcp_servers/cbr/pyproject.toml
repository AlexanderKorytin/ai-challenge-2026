[project]
name = "cbr-mcp"
version = "0.1.0"
description = "MCP-сервер официальных курсов валют ЦБ РФ"
requires-python = ">=3.11"
dependencies = [
    # Та же граница, что у клиента myharness: следующая крупная версия ломает молча.
    "mcp>=2.2,<3",
    # Клиент HTTP, которым ходит сама библиотека mcp; объявлен явно, потому что сервер
    # импортирует его сам, а не только через mcp.
    "httpx2>=2.12,<3",
    "uvicorn>=0.30",
    # Сроки заданий по выражению cron — своего разбора cron не пишем.
    "croniter>=6,<7",
]
