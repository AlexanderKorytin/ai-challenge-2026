# Пересылка MCP-сервера курсов ЦБ — одна на оба входа. Копируется в /etc/nginx/snippets/cbr-mcp.conf
# (не подключается из каталога доставки: неудачный rsync --delete уронил бы nginx при перезапуске
# вместе с сайтами панели) и подключается строкой `include /etc/nginx/snippets/cbr-mcp.conf;`:
#   сайт koritin84.fvds.ru — /etc/nginx/vhosts-resources/koritin84.fvds.ru/mcp.conf (каталог своих
#     вставок, панель подключает его в оба блока сайта, 80 и 443, и не перезаписывает);
#   IP-адрес — deploy/nginx-ip.conf.
# Токена здесь нет и быть не должно: его проверяет сама служба.
location = /mcp {
    # Голый HTTP сюда не доходит: сайт заведён с redirect_http=on, и блок порта 80 отвечает
    # `return 301` раньше любой location. Отказ ниже — вторая защита на случай, если
    # перенаправление выключат: тогда запрос с токеном по HTTP получит 403, а не службу.
    if ($https = "") {
        return 403;
    }
    proxy_pass http://127.0.0.1:8770;
    proxy_http_version 1.1;
    # Служба пропускает только свои имена (защита от подмены имени узла): имя сайта и
    # `83.136.235.149:8443`. `$http_host` — с портом, как его прислал клиент.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Поток ответа MCP не копится в nginx.
    proxy_buffering off;
}
