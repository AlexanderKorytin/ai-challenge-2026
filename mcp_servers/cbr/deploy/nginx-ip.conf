# HTTPS по IP-адресу: https://83.136.235.149:8443/mcp. Ставится в /etc/nginx/conf.d/cbr-mcp-ip.conf.
# Зачем: сертификат на имя koritin84.fvds.ru упирается в общий недельный предел Let's Encrypt на
# fvds.ru (50 на всех клиентов FirstVDS). Сертификат на сам IP панель уже получает и продлевает
# (acme.sh панели, живёт ~6 дней, продление каждые 3 дня); nginx перечитывает его таймером
# nginx-reload.timer раз в сутки.
server {
    listen 83.136.235.149:8443 ssl;
    server_name 83.136.235.149;
    ssl_certificate     /usr/local/mgr5/etc/scripts/acmesh/83.136.235.149/fullchain.cer;
    ssl_certificate_key /usr/local/mgr5/etc/scripts/acmesh/83.136.235.149/83.136.235.149.key;

    include /opt/challenge/services/cbr-mcp/deploy/nginx-mcp.conf;

    location / {
        return 404;
    }
}
