[project]
name = "steam-mcp"
version = "0.1.0"
description = "MCP-сервер игрового агента: магазин Steam и хранилище SQLite"
requires-python = ">=3.11"
dependencies = [
    # Та же граница, что у клиента myharness и серверов cbr и pipeline.
    "mcp>=2.2,<3",
    "httpx2>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["steam_store.py", "games_db.py", "server.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
